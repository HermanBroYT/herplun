# ============================================================
#  HerPlun 1.2 — настройки
#  ВНИМАНИЕ! Если сделать ошибку в этом файле (лишний пробел,
#  неверный отступ, пропущенная кавычка), плагин может сломаться,
#  а сервер — упасть (краш)! Меняйте только текст и числа.
#  Сделайте копию файла перед правкой. Применяется после
#  перезапуска сервера или команды /herplun reload.
#  Цвета: &a &c &e и т.д.
# ============================================================

# Префикс перед сообщениями плагина
prefix: "&c[HerPlun] &f"

messages:
  # Если нет прав на команду
  no-permission: '&c"HerPlun" У вас нет прав что прописать команду!'
  # Когда замученный игрок пишет в чат
  muted-permanent: "&cВы замучены навсегда и не можете писать в чат."
  # {time} — сколько осталось
  muted-temp: "&cВы замучены. Осталось: &e{time}"
  # Когда включены технические работы
  technical-kick: "&cНа сервере проводятся технические работы.\n&fЗаходить могут только администраторы."

voice:
  # Ссылка на любой голосовой чат (мод/программа). Можно заменить на свою.
  link: "https://modrinth.com/plugin/simple-voice-chat"
  # {link} — ссылка. Она кликабельная.
  message: "&aСкачать голосовой чат: &b{link}"

mute:
  # Эти команды тоже запрещены замученным (личные сообщения и т.п.)
  blocked-commands:
    - msg
    - tell
    - w
    - whisper
    - m
    - t
    - pm
    - r
    - reply
    - me
    - say

report:
  # Пауза между жалобами одного игрока (секунды)
  cooldown-seconds: 30
  # Сколько жалоб одновременно может быть открыто у одного игрока
  max-per-player: 5

# Анти-чит. Сообщения видят игроки с правом herplun.anti-cheat.
# Плагин ТОЛЬКО предупреждает, наказаний не выдаёт. Возможны ложные срабатывания.
anticheat:
  enabled: true
  # Сколько срабатываний подряд нужно до сообщения
  alert-after: 2
  # Пауза между сообщениями об одном и том же (секунды)
  alert-cooldown: 5
  speed:
    # Максимальная средняя скорость, блоков в секунду
    max-bps: 16.0
  reach:
    # Максимальная дальность удара по игроку, блоков
    max: 5.0
