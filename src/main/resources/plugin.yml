name: HerPlun
version: ${project.version}
main: ru.herplun.HerPlun
api-version: '1.13'
description: Баны, муты, жалобы, привилегии и проверка на читы
commands:
  ban:
    description: Забанить игрока навсегда
    usage: /ban <игрок> [причина]
  unban:
    description: Разбанить игрока
    usage: /unban <игрок>
  timeban:
    description: Временный бан игрока
    usage: /timeban <игрок> <время> [причина]
  mute:
    description: Замутить игрока
    usage: /mute <игрок> [время]
  unmute:
    description: Снять мут с игрока
    usage: /unmute <игрок>
  help:
    description: Список команд HerPlun
    usage: /help
  report:
    description: Пожаловаться на игрока
    usage: /report <игрок> <причина>
  check:
    description: Проверка на читы
    usage: /check <on|off|tp|time>
  voice:
    description: Ссылка на скачивание голосового чата
    usage: /voice
  herplun:
    description: Управление HerPlun и привилегиями
    usage: /herplun privilege <set|addtemp|remove> ...
permissions:
  herplun.ban:
    default: op
  herplun.unban:
    default: op
  herplun.timeban:
    default: op
  herplun.mute:
    default: op
  herplun.unmute:
    default: op
  herplun.help:
    default: true
  herplun.report:
    default: true
  herplun.voice:
    default: true
  herplun.privilege:
    default: op
  herplun.check.on:
    default: op
  herplun.check.off:
    default: op
  herplun.check.tp:
    default: op
  herplun.check.time:
    default: op
